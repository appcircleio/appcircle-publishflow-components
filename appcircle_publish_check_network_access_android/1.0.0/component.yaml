platform: Android
purpose: Publish
buildPlatform:
displayName: "Check Network Access"
description: "Checks runner access to the Google Play and Huawei AppGallery endpoints used by the Appcircle publish module."
docsUrl: https://docs.appcircle.io/publish-integrations/common-publish-integrations/check-network-access
requiredComponents:
precedingComponents:
followingComponents:
webUrl: https://github.com/appcircleio/appcircle-publish-network-check
repoUrl: https://github.com/appcircleio/appcircle-publish-network-check.git
commit: 543ace9
inputs:
  - key: "AC_CHECK_NETWORK_WWW_GOOGLEAPIS_COM"
    title: "Check Google APIs Access"
    description: "Checks if the runner can access `https://www.googleapis.com/` when enabled."
    defaultValue: "true"
    isRequired: false
    editorType: "select"
    options: "true,false"
    helpText: ""
  - key: "AC_CHECK_NETWORK_ANDROIDPUBLISHER_GOOGLEAPIS_COM"
    title: "Check Google Play Android Publisher API Access"
    description: "Checks if the runner can access `https://androidpublisher.googleapis.com/` when enabled."
    defaultValue: "true"
    isRequired: false
    editorType: "select"
    options: "true,false"
    helpText: ""
  - key: "AC_CHECK_NETWORK_CONNECT_API_CLOUD_HUAWEI_COM"
    title: "Check Huawei AppGallery Connect API Access"
    description: "Checks if the runner can access `https://connect-api.cloud.huawei.com/` when enabled. The dynamic upload host is not checked; add it to the custom URL input if you know it."
    defaultValue: "true"
    isRequired: false
    editorType: "select"
    options: "true,false"
    helpText: ""
  - key: "AC_CHECK_CONNECTION_TIMEOUT"
    title: "Set Connection Timeout"
    description: "Specifies the maximum time (integer, in seconds) allowed for establishing a connection to the server before the request is aborted."
    defaultValue: "8"
    isRequired: false
    helpText: ""
  - key: "AC_CHECK_CONNECTION_MAX_TIMEOUT"
    title: "Set Max Timeout"
    description: "Specifies the maximum total time (integer, in seconds) allowed for the entire request (including connection, data transfer, and response) before it is aborted."
    defaultValue: "20"
    isRequired: false
    helpText: ""
  - key: "AC_CHECK_NETWORK_EXTRA_URL_PARAMETERS"
    title: "Additional URL parameters"
    description: "Additional URL parameters to check network access (comma \",\" separated ; e.g. `https://URL1, https://URL2`)."
    defaultValue: "$AC_CHECK_NETWORK_EXTRA_URL_PARAMETERS"
    isRequired: false
    helpText: ""
outputs:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
  - "main.rb"
  - "config.rb"
  - "checker.rb"
  - "report.rb"
  - "curl_exit_codes.rb"
